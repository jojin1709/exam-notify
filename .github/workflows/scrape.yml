name: Scrape exam notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force scrape even if no changes"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: npm run scrape
        env:
          CI: true

      - name: Commit and push if data changed
        run: |
          git config user.name "exam-notify-bot"
          git config user.email "actions@github.com"
          git add data/exams.json
          if ! git diff --quiet --cached -- data/exams.json; then
            git commit -m "chore: update exam notifications [automated] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "✅ Data updated and pushed."
          else
            echo "ℹ️ No changes to data/exams.json — nothing to commit."
          fi
